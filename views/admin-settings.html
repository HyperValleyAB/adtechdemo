<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Adtech Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/public/img/favicon.svg">
<link rel="stylesheet" href="/public/css/admin.css">
</head>
<body class="admin-shell">
  <aside class="sidebar">
    <a class="sidebar__brand" href="/admin" aria-label="Leeads Adprofit · Adtech Demo">
      <span class="sidebar__brand-logo" role="img" aria-label="Leeads Adprofit"></span>
      <span class="sidebar__brand-sub">Adtech Demo</span>
    </a>
    <nav class="sidebar__nav">
      <a class="sidebar__link" href="/admin">All demos</a>
      <a class="sidebar__link" href="/admin/new">Create demo</a>
      <a class="sidebar__link" href="/admin/templates">Templates</a>
      <a class="sidebar__link sidebar__link--active" href="/admin/settings">Settings</a>
    </nav>
    <form class="sidebar__logout" method="post" action="/logout">
      <input type="hidden" name="_csrf" value="{{csrfToken}}">
      <button type="submit" class="btn-ghost btn-block">Sign out</button>
    </form>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="topbar__crumbs">
        <a href="/admin">All demos</a>
        <span class="topbar__sep">/</span>
        <span>Settings</span>
      </div>
    </header>

    <section class="page-head">
      <div>
        <div class="page-eyebrow">Account</div>
        <h1>Settings</h1>
        <p class="page-sub">Change the admin login password.</p>
      </div>
    </section>

    {{{flash}}}

    <section class="card settings-card settings-card--narrow">
      <h2 class="card__title">Change password</h2>
      <form method="post" action="/admin/settings" class="password-form" autocomplete="off">
        <input type="hidden" name="_csrf" value="{{csrfToken}}">

        <div class="field">
          <label for="currentPassword">Current password</label>
          <div class="password-input">
            <input id="currentPassword" type="password" name="currentPassword" required autocomplete="current-password">
            <button type="button" class="password-toggle" aria-controls="currentPassword" aria-pressed="false" aria-label="Show password" tabindex="-1">
              <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 4.22-5.16M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M9.88 9.88a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-input">
            <input id="newPassword" type="password" name="newPassword" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-controls="newPassword" aria-pressed="false" aria-label="Show password" tabindex="-1">
              <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 4.22-5.16M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M9.88 9.88a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <small class="field-hint">Minimum 8 characters.</small>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-input">
            <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-controls="confirmPassword" aria-pressed="false" aria-label="Show password" tabindex="-1">
              <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 4.22-5.16M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M9.88 9.88a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="password-form__footer">
          <button type="submit" class="btn-primary">Update password</button>
          <span class="password-form__note">{{{sourceNote}}}</span>
        </div>
      </form>
    </section>
  </main>

  <script src="/public/js/admin.js" defer></script>
</body>
</html>
