<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Adtech Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/public/img/favicon.svg">
<link rel="stylesheet" href="/public/css/admin.css">
</head>
<body class="login-shell">
  <main class="login-card">
    <span class="login-logo" role="img" aria-label="Leeads Adprofit"></span>
    <span class="public-eyebrow">Adtech Demo</span>
    <h1>Sign in</h1>
    <p class="login-sub">Internal tool for the Adops team. Admin password required.</p>
    {{{errorBlock}}}
    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{csrfToken}}">
      <input type="hidden" name="next" value="{{nextUrl}}">
      <label for="password">Admin password</label>
      <input id="password" type="password" name="password" required autofocus>
      <button class="btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
