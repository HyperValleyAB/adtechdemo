<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Adtech Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/public/img/favicon.svg">
<link rel="stylesheet" href="/public/css/admin.css">
</head>
<body class="login-shell">
  <main class="login-card">
    <span class="login-logo" role="img" aria-label="Leeads Adprofit"></span>
    <span class="public-eyebrow">Adtech Demo</span>
    <h1>Sign in</h1>
    <p class="login-sub">Internal tool for the Adops team. Admin password required.</p>
    {{{errorBlock}}}
    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{csrfToken}}">
      <input type="hidden" name="next" value="{{nextUrl}}">
      <label for="password">Admin password</label>
      <div class="password-input">
        <input id="password" type="password" name="password" required autofocus>
        <button type="button" class="password-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password" tabindex="-1">
          <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 4.22-5.16M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <button class="btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
